<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>متجري البسيط</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>متجري البسيط</h1>
  </header>

  <section class="products">
    <div class="product">
      <img src="https://via.placeholder.com/150" alt="منتج 1">
      <h3>منتج 1</h3>
      <p>السعر: 100 درهم</p>
      <button onclick="addToCart('منتج 1', 100)">أضف إلى السلة</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/150" alt="منتج 2">
      <h3>منتج 2</h3>
      <p>السعر: 150 درهم</p>
      <button onclick="addToCart('منتج 2', 150)">أضف إلى السلة</button>
    </div>
  </section>

  <section class="cart">
    <h2>سلة المشتريات</h2>
    <ul id="cartItems"></ul>
    <p id="total">المجموع: 0 درهم</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
